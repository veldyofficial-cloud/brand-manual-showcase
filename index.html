<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brand Manual</title>
<meta name="description" content="로고와 브랜드 정보로 브랜드 문서 PDF와 목업을 만듭니다." />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="app/style.css" />
</head>
<body>
<header class="top">
  <span class="logo">Brand Manual</span>
  <a href="showcase.html">샘플</a>
</header>

<main>
  <section id="form-panel">
    <form id="form" autocomplete="off">
      <label class="drop">
        <input type="file" id="logo" accept="image/png,image/jpeg,image/svg+xml,image/webp" required />
        <img id="logo-preview" alt="" hidden />
        <span class="drop-text">로고</span>
      </label>

      <div class="row">
        <input name="nameKo" placeholder="브랜드명" />
        <input name="nameEn" placeholder="English name" />
      </div>
      <input name="industry" placeholder="업종" />
      <textarea name="description" rows="2" placeholder="소개"></textarea>
      <div class="row">
        <input name="target" placeholder="타깃" />
        <input name="tone" placeholder="톤앤매너" />
      </div>
      <input name="slogan" placeholder="슬로건" />

      <p class="label">업종</p>
      <div class="pills" id="industries"></div>
      <label class="check"><input type="checkbox" name="premium" />프리미엄</label>

      <p class="label">컬러</p>
      <div class="colors" id="colors"></div>

      <p class="label">연락처</p>
      <div class="row">
        <input name="person" placeholder="이름" />
        <input name="role" placeholder="직함" />
      </div>
      <div class="row">
        <input name="web" placeholder="웹사이트" />
        <input name="email" placeholder="이메일" />
      </div>
      <div class="row">
        <input name="phone" placeholder="전화" />
        <input name="address" placeholder="주소" />
      </div>

      <p class="label">문서</p>
      <div class="docs" id="docs"></div>

      <button type="submit" class="primary">생성</button>
    </form>
  </section>

  <section id="result" hidden>
    <div class="result-head">
      <h2 id="result-title"></h2>
      <button class="primary small" id="zip" hidden>ZIP</button>
    </div>
    <p class="status" id="status"></p>
    <div class="progress"><div id="bar"></div></div>

    <p class="label">목업 <span id="picked"></span></p>
    <div class="mocks" id="mocks"></div>

    <p class="label">문서</p>
    <div id="doc-list"></div>

    <div id="editor" hidden>
      <p class="label">문구</p>
      <div class="ai">
        <button type="button" class="text" id="copy-prompt">AI 프롬프트 복사</button>
        <textarea id="ai-answer" rows="2" placeholder="AI 답변 붙여넣기"></textarea>
        <button type="button" class="text" id="apply-answer">적용</button>
      </div>
      <div id="fields"></div>
      <button class="primary" id="rerender">다시 만들기</button>
    </div>
    <button class="text" id="new">새로 만들기</button>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/pdfkit@0.17.2/js/pdfkit.standalone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module" src="app/app.js"></script>
</body>
</html>
